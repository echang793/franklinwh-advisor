name: tests

on:
  push:
    branches: [main]
  pull_request:
  # Nightly on purpose: several tests once drifted red purely because the
  # calendar moved on (hardcoded dates vs a 30-day prune), with no code change.
  schedule:
    - cron: "17 13 * * *"
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: pip install -e ".[test,ev]" httpx
      - name: Test
        run: python -m pytest tests/ -q

  lint:
    # Ruff is clean as of 2026-10-05 (config in pyproject.toml); keep it that way.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install ruff
        run: pip install ruff
      - name: Lint
        run: ruff check franklinwh_scraper tests scripts scrape.py
